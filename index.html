<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Wizard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<div class="text-center">


   
    <h1 class="py-5 display-1">⏰Time Wizard🪄</h1>
    <form class="time-form">
        <input type="number" class="input-field" name="minutes" placeholder="Time (minutes)">
        <input type="submit" value="+ Add Time" class="add-button">
    </form>
</div>
<div class="container">
    <div class="row justify-content-center my-5">
        
        <div class="col-md-8">
            <div class="d-flex mb-3">
                <button type="button" class="btn btn-primary me-2" id="edit-button"><i class="bi bi-pencil-fill"></i></button>
                <button type="button" class="btn btn-primary d-none" id="clear-button"><i class="bi bi-trash"></i></button>

            </div>
            <table class="w-100" id="user-table">
                <thead>
                    <tr>
                        <th class="task-num"> Task # </th>
                        <th class="time-spent w-50"> Time Spent </th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot>
                </tfoot>
            </table>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="validate.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
